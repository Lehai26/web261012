<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 영화 보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>나의 영화 보드</h1>
    <article class="card">
        <img
            class="poster"
            src="https://image.tmdb.org/t/p/w342/jgEUQ2niE6E77N16IUC6Mx1NBvIx.jpg"
            alt="인터스텔라 영화 포스터"
        >
        <span class="badge">★ 8.7</span>
        <div class="info">
            <h2>인터스텔라</h2>
            <p class="year">2014년</p>
            <p class="overview">
                인류의 미래를 위해 새로운 행성을 찾아 우주로 떠나는 탐험 이야기.
            </p>
        </div>
    </article>
    <footer>
        <p>
            이 사이트는 TMDB API를 사용하지만 TMDB의 보증이나 인증을 받지 않았습니다.
            <br>
            This product uses the TMDB API but is not endorsed or certified by TMDB.
        </p>
        <p>
            포스터와 영화 정보: TMDB
            (<a href="https://www.themoviedb.org/" target="_blank">themoviedb.org</a>)
        </p>
